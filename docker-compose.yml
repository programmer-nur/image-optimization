# Host ports are deliberately non-default: 9000 and 5432 are commonly already taken
# by other projects on a dev machine, and colliding would point tests at someone
# else's data store.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imgopt
      POSTGRES_PASSWORD: imgopt
      POSTGRES_DB: imgopt
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imgopt -d imgopt']
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for S3. Prefixes mirror production: staging/, original/, master/, derived/.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/imgopt-dev;
      mc anonymous set none local/imgopt-dev;
      echo 'bucket ready';
      "

  # Stands in for SQS. Queue + DLQ mirror the production redrive topology.
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - '9324:9324'
      - '9325:9325'
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  pgdata:
  miniodata:
